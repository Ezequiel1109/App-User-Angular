<div class="card">
    <div class="card-header">
        <h5 class="card-title">login page</h5>
    </div>
    <div class="card-body">
        <form (ngSubmit)="onSubmit()">
            <input type="text" name="username" class="form-control my-2 w-25" placeholder="Username"
                [(ngModel)]="user.username">
            <input type="password" name="password" class="form-control my-2 w-25" placeholder="Password"
                [(ngModel)]="user.password">
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
    </div>
</div>
